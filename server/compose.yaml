services:
  planaloud:
    build: .
    restart: unless-stopped
    ports:
      - "${PLANALOUD_BIND:-${DAYFLOW_BIND:-127.0.0.1}}:${PLANALOUD_PORT:-${DAYFLOW_PORT:-8765}}:8765"
    environment:
      PLANALOUD_REGISTRATION: ${PLANALOUD_REGISTRATION:-${DAYFLOW_REGISTRATION:-true}}
      PLANALOUD_INVITE_CODE: ${PLANALOUD_INVITE_CODE:-${DAYFLOW_INVITE_CODE:-}}
      PLANALOUD_RUNTIME_REQUESTS: ${PLANALOUD_RUNTIME_REQUESTS:-${DAYFLOW_RUNTIME_REQUESTS:-10}}
      PLANALOUD_RUNTIME_WINDOW_SECONDS: ${PLANALOUD_RUNTIME_WINDOW_SECONDS:-${DAYFLOW_RUNTIME_WINDOW_SECONDS:-3600}}
      PLANALOUD_UPDATES_DIR: /updates
      PLANALOUD_MAX_SYNC_BYTES: ${PLANALOUD_MAX_SYNC_BYTES:-${DAYFLOW_MAX_SYNC_BYTES:-0}}
    volumes:
      - planaloud-data:/data
      - ./updates:/updates:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2-alpine
    profiles: [cloud]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PLANALOUD_DOMAIN: ${PLANALOUD_DOMAIN:-${DAYFLOW_DOMAIN:-localhost}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [planaloud]
volumes:
  planaloud-data:
    name: ${PLANALOUD_DATA_VOLUME:-planaloud-data}
  caddy-data:
  caddy-config:
